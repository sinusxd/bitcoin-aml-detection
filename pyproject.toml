[project]
name = "bitcoin-aml-detection"
version = "0.1.0"
description = "Binary classification of suspicious Bitcoin transactions (AML) on the Elliptic dataset"
readme = "README.md"
requires-python = ">=3.10.4,<3.11"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
]
